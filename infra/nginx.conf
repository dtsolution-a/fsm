# Single entry point: /api/* -> backend, everything else -> web. Mirrors the AWS ALB rule set.
# Per-address request limits (a second line of defence behind the limits inside the API).
limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server_tokens off;

server {
  listen 80;
  client_max_body_size 10m;        # photo uploads
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;
  keepalive_timeout 30s;
  limit_conn perip 40;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # sign-in and token refresh: slow guessing down before it reaches the API
  location ~ ^/api/v1/auth/(login|refresh|change-password) {
    limit_req zone=login burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=api burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # overwrite (not append) so a client cannot fake its address to dodge the limits
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
